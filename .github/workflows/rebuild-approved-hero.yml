name: Rebuild approved hero

on:
  push:
    paths:
      - '.hero-src/**'
      - '.github/workflows/rebuild-approved-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode approved JPEG
        shell: bash
        run: |
          set -euo pipefail
          cat .hero-src/hero-v20.part-* | tr -d '\n\r ' | base64 --decode > hero-illustration-v20-exact-text.jpg
          test -s hero-illustration-v20-exact-text.jpg
          file hero-illustration-v20-exact-text.jpg | grep -qi 'JPEG image data'
          sha256sum hero-illustration-v20-exact-text.jpg
      - name: Commit rebuilt hero
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hero-illustration-v20-exact-text.jpg
          if git diff --cached --quiet; then
            echo 'No image change required.'
            exit 0
          fi
          git commit -m 'fix(site): rebuild approved hero JPEG'
          git push
