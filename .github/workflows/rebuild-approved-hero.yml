name: Install approved full-resolution hero

on:
  push:
    paths:
      - '.hero-src/exact-v21.ready'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode exact approved JPEG
        shell: bash
        run: |
          set -euo pipefail
          cat .hero-src/exact-v21.part-* | tr -d '\n\r ' | base64 --decode > hero-illustration-v21.jpg
          test -s hero-illustration-v21.jpg
          file hero-illustration-v21.jpg | grep -qi 'JPEG image data'
          echo 'f2ad6cef2d136d6cb61ec3ea388e689a42d47673be4ac3faeeed41842a4b394c  hero-illustration-v21.jpg' | sha256sum -c -
      - name: Commit exact hero
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hero-illustration-v21.jpg
          git commit -m 'fix(site): install approved full-resolution hero'
          git push
